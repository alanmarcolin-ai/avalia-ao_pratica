<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Página</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Minha Galeria</h1>

        <button id="themeButton" onclick="alternarTema()">
            🌙 Modo escuro
        </button>
    </header>

    <main>

        <section class="galeria">

            <article class="card">
                <img src="imagens/imagem1.jpg" alt="Imagem 1">

                <h2>Imagem 1</h2>
                <p>Essa é a primeira imagem da nossa galeria.</p>

                <div class="botoes">
                    <button class="like" onclick="curtir(this)">
                        👍 <span>0</span>
                    </button>

                    <button class="dislike" onclick="descurtir(this)">
                        👎 <span>0</span>
                    </button>
                </div>
            </article>


            <article class="card">
                <img src="imagens/imagem2.jpg" alt="Imagem 2">

                <h2>Imagem 2</h2>
                <p>Essa é a segunda imagem da nossa galeria.</p>

                <div class="botoes">
                    <button class="like" onclick="curtir(this)">
                        👍 <span>0</span>
                    </button>

                    <button class="dislike" onclick="descurtir(this)">
                        👎 <span>0</span>
                    </button>
                </div>
            </article>


            <article class="card">
                <img src="imagens/imagem3.jpg" alt="Imagem 3">

                <h2>Imagem 3</h2>
                <p>Essa é a terceira imagem da nossa galeria.</p>

                <div class="botoes">
                    <button class="like" onclick="curtir(this)">
                        👍 <span>0</span>
                    </button>

                    <button class="dislike" onclick="descurtir(this)">
                        👎 <span>0</span>
                    </button>
                </div>
            </article>

        </section>

    </main>

    <footer>
        <p>© 2026 - Minha Galeria</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
